<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1923" />
      <stop offset="50%" stop-color="#142436" />
      <stop offset="100%" stop-color="#09141f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061" />
      <stop offset="100%" stop-color="#c9971e" />
    </linearGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3f5f" />
      <stop offset="100%" stop-color="#121e2d" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e3650" stroke-width="2"/>
  
  <!-- Cyber / Hex / Tech Grid Pattern in BG -->
  <g opacity="0.15" stroke="#00e5ff" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
  </g>

  <!-- Glowing Emblem / Silhouette -->
  <g transform="translate(200, 200)">
    <!-- Back Aura -->
    <circle r="95" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.3" stroke-dasharray="8 6"/>
    <circle r="85" fill="#0c1724" stroke="url(#goldGrad)" stroke-width="3" filter="url(#neonGlow)"/>

    <!-- Head / Gamer Silhouette -->
    <!-- Headset -->
    <path d="M-55,-10 A55,55 0 0,1 55,-10" fill="none" stroke="#00e5ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="-64" y="-18" width="14" height="28" rx="6" fill="#f5d061" stroke="#0f1923" stroke-width="2"/>
    <rect x="50" y="-18" width="14" height="28" rx="6" fill="#f5d061" stroke="#0f1923" stroke-width="2"/>
    <path d="M-58,10 Q-35,35 -20,28" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-18" cy="28" r="4" fill="#00e5ff"/>

    <!-- Head -->
    <ellipse cx="0" cy="-8" rx="35" ry="42" fill="#1b2c42"/>
    
    <!-- Hair -->
    <path d="M-35,-20 Q-15,-55 25,-42 Q38,-15 36,-10 Q15,-30 -5,-25 Q-25,-20 -35,-20 Z" fill="#2d486b"/>
    
    <!-- Face Mask / Visor -->
    <polygon points="-25,-2 25,-2 18,15 -18,15" fill="#00e5ff" opacity="0.8"/>

    <!-- Shoulders / Jersey -->
    <path d="M-65,75 Q-40,35 0,35 Q40,35 65,75 L80,120 L-80,120 Z" fill="url(#armorGrad)"/>
    <path d="M-20,35 L0,70 L20,35 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Jersey Logo Accent -->
    <polygon points="0,52 -10,65 10,65" fill="#0f1923"/>
  </g>

  <!-- Tagline / Name on Bottom -->
  <text x="200" y="375" text-anchor="middle" font-family="'Cinzel', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">
    DDAHYUK
  </text>
  <text x="200" y="405" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="700" font-size="14" fill="#00e5ff" letter-spacing="5">
    TOP CARRY &bull; 2,371 LP
  </text>
</svg>
